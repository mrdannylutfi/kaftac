  grafana:
    image: grafana/grafana:latest
    container_name: telemetry_grafana
    ports:
      - "3000:3000"
    environment:
      - GF_SECURITY_ADMIN_PASSWORD=admin
    volumes:
      - ./provisioning-alerting.yaml:/etc/grafana/provisioning/alerting/alerting.yaml
      - ./provisioning-rules.yaml:/etc/grafana/provisioning/alerting/rules.yaml
    depends_on:
      - prometheus
